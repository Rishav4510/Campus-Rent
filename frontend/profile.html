<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Profile — CampusRent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="profile">
<div id="navbar" class="navbar"></div>

<div class="container page-head">
  <div class="eyebrow">Your account</div>
  <h1>Profile</h1>
</div>

<div class="container" style="max-width:560px; padding-bottom:64px;">
  <div class="panel">
    <div id="alertBox"></div>
    <form id="profileForm">
      <div class="form-row">
        <label for="name">Full name</label>
        <input type="text" id="name" required />
      </div>
      <div class="form-row">
        <label for="email">Email <span style="text-transform:none; font-weight:400;">(cannot be changed)</span></label>
        <input type="email" id="email" disabled />
      </div>
      <div class="form-row">
        <label for="hostel">Hostel / block</label>
        <input type="text" id="hostel" />
      </div>
      <div class="form-row">
        <label for="phone">Phone</label>
        <input type="text" id="phone" placeholder="Optional, shown to owners when you rent" />
      </div>
      <button type="submit" class="btn btn-mustard btn-block" id="submitBtn">Save changes</button>
    </form>
  </div>

  <div class="panel">
    <h3 style="font-size:16px;">Account</h3>
    <p class="mono" style="font-size:13px;">Role: <span id="roleLabel"></span></p>
    <button class="btn btn-outline btn-sm" id="logoutBtn2">Log out</button>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
