<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>List an Item — CampusRent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="add-item">
<div id="navbar" class="navbar"></div>

<div class="container page-head">
  <div class="eyebrow">Turn idle gear into rent</div>
  <h1>List an item</h1>
  <p>Fill in the details below. It'll appear in Browse Items as soon as you submit.</p>
</div>

<div class="container" style="max-width:680px; padding-bottom:64px;">
  <div class="panel">
    <div id="alertBox"></div>
    <form id="itemForm">
      <div class="form-row">
        <label for="name">Item name</label>
        <input type="text" id="name" placeholder="Casio FX-991ES Calculator" required />
      </div>
      <div class="form-row">
        <label for="description">Description</label>
        <textarea id="description" placeholder="Condition, what's included, any usage notes…" required></textarea>
      </div>
      <div class="grid-2">
        <div class="form-row">
          <label for="category">Category</label>
          <select id="category" required>
            <option value="">Select…</option>
            <option>Electronics</option>
            <option>Books</option>
            <option>Lab Equipment</option>
            <option>Sports</option>
            <option>Cycles</option>
            <option>Instruments</option>
            <option>Other</option>
          </select>
        </div>
        <div class="form-row">
          <label for="pricePerDay">Price per day (₹)</label>
          <input type="number" id="pricePerDay" min="1" placeholder="20" required />
        </div>
      </div>
      <div class="grid-2">
        <div class="form-row">
          <label for="condition">Condition</label>
          <select id="condition">
            <option>New</option>
            <option selected>Good</option>
            <option>Fair</option>
            <option>Worn</option>
          </select>
        </div>
        <div class="form-row">
          <label for="location">Pickup location <span style="text-transform:none; font-weight:400;">(optional)</span></label>
          <input type="text" id="location" placeholder="Block C, Room 214" />
        </div>
      </div>
      <div class="form-row">
        <label for="image">Photo <span style="text-transform:none; font-weight:400;">(optional)</span></label>
        <label class="upload-drop" id="dropLabel">
          Click to choose an image (JPG, PNG, WEBP · up to 5MB)
          <input type="file" id="image" accept="image/*" style="display:none;" />
        </label>
        <div class="upload-preview" id="previewWrap" style="display:none;">
          <img id="previewImg" alt="preview" />
        </div>
      </div>
      <button type="submit" class="btn btn-mustard btn-block" id="submitBtn">Publish listing</button>
    </form>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/add-item.js"></script>
</body>
</html>
