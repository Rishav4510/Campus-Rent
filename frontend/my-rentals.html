<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Rentals — CampusRent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="my-rentals">
<div id="navbar" class="navbar"></div>

<div class="container page-head">
  <div class="eyebrow">Renter dashboard</div>
  <h1>My rentals</h1>
  <p>Every request you've sent, and where it stands.</p>
</div>

<div class="container" style="padding-bottom:64px;">
  <div class="panel">
    <div class="table-wrap">
      <table id="rentalsTable">
        <thead>
          <tr>
            <th>Item</th>
            <th>Owner</th>
            <th>Dates</th>
            <th>Total</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="rentalsBody">
          <tr><td colspan="6"><div class="loader">Loading your rentals…</div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/my-rentals.js"></script>
</body>
</html>
